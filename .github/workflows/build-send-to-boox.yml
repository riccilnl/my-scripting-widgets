name: Build Send to BOOX

on:
  push:
    branches: [main]
    paths:
      - "scripts/Send to BOOX/**"
      - ".github/workflows/build-send-to-boox.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scripting-send-to-boox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify packaging utility
        run: node --test scripts/update_links.test.js

      - name: Validate BOOX startup and sharing contracts
        run: node --test "scripts/Send to BOOX/tests/startup.test.cjs"

      - name: Bundle both TSX entrypoints
        run: |
          npx --yes esbuild@0.28.2 "scripts/Send to BOOX/index.tsx" "scripts/Send to BOOX/intent.tsx" --bundle --platform=neutral --external:scripting --jsx=transform --jsx-factory=createElement --jsx-fragment=Fragment --outdir="${{ runner.temp }}/boox-tsx-check"

      - name: Validate share retry semantics
        run: |
          npx --yes esbuild@0.28.2 "scripts/Send to BOOX/share-result.ts" --bundle --platform=node --format=cjs --outfile="${{ runner.temp }}/boox-share-result.cjs"
          BOOX_SHARE_RESULT_MODULE="${{ runner.temp }}/boox-share-result.cjs" node --test "scripts/Send to BOOX/tests/share-result.test.cjs"

      - name: Build Send to BOOX installer
        run: node scripts/update_links.js --project "Send to BOOX"

      - name: Validate package contents and author
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          folder = pathlib.Path("scripts/Send to BOOX")
          with zipfile.ZipFile("Send to BOOX.scripting") as archive:
              names = set(archive.namelist())
              for name in ("boox.ts", "share-result.ts", "index.tsx", "intent.tsx", "README.md", "script.json"):
                  target = "Send to BOOX/" + name
                  assert target in names, target
                  assert archive.read(target) == (folder / name).read_bytes(), target
              manifest = json.loads(archive.read("Send to BOOX/script.json"))
              assert manifest["author"]["name"] == "Ricci"
              assert manifest["version"].count(".") == 2
              assert manifest["remoteResource"] == {
                  "url": "https://raw.githubusercontent.com/riccilnl/my-scripting-widgets/refs/heads/main/Send%20to%20BOOX.scripting",
                  "autoUpdateInterval": 3600,
              }
          print("SEND_TO_BOOX_PACKAGE_PASS")
          PY

      - name: Publish package and installation link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Send to BOOX.scripting' README.md
          if ! git diff --cached --quiet; then
            git commit -m "build(boox): publish Scripting installation package"
            git push
          fi
