name: Build Send to BOOX

on:
  push:
    branches: [main]
    paths:
      - "scripts/Send to BOOX/**"
      - ".github/workflows/build-send-to-boox.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scripting-send-to-boox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify packaging utility
        run: node --test scripts/update_links.test.js

      - name: Validate BOOX startup and sharing contracts
        run: node --test "scripts/Send to BOOX/tests/startup.test.cjs"

      - name: Bundle both TSX entrypoints
        run: |
          npx --yes esbuild@0.28.2 "scripts/Send to BOOX/index.tsx" "scripts/Send to BOOX/intent.tsx" --bundle --platform=neutral --external:scripting --jsx=transform --jsx-factory=createElement --jsx-fragment=Fragment --outdir="${{ runner.temp }}/boox-tsx-check"

      - name: Validate share retry semantics
        run: |
          npx --yes esbuild@0.28.2 "scripts/Send to BOOX/share-result.ts" --bundle --platform=node --format=cjs --outfile="${{ runner.temp }}/boox-share-result.cjs"
          BOOX_SHARE_RESULT_MODULE="${{ runner.temp }}/boox-share-result.cjs" node --test "scripts/Send to BOOX/tests/share-result.test.cjs"

      - name: Verify BOOX changes pagination
        run: |
          npx --yes esbuild@0.28.2 "scripts/Send to BOOX/cloud-pagination.ts" --bundle --platform=node --format=cjs --outfile="${{ runner.temp }}/boox-cloud-pagination.cjs"
          BOOX_PAGINATION_MODULE="${{ runner.temp }}/boox-cloud-pagination.cjs" node --test "scripts/Send to BOOX/tests/cloud-pagination.test.cjs"
      - name: Build Send to BOOX installer
        run: node scripts/update_links.js --project "Send to BOOX"

      - name: Validate package contents and author
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          folder = pathlib.Path("scripts/Send to BOOX")
          with zipfile.ZipFile("Send to BOOX.scripting") as archive:
              names = set(archive.namelist())
              for name in ("boox.ts", "cloud-pagination.ts", "share-result.ts", "index.tsx", "intent.tsx", "README.md", "script.json"):
                  target = "Send to BOOX/" + name
                  assert target in names, target
                  assert archive.read(target) == (folder / name).read_bytes(), target
              manifest = json.loads(archive.read("Send to BOOX/script.json"))
              assert manifest["author"]["name"] == "Ricci"
              assert manifest["version"].count(".") == 2
              assert manifest["remoteResource"] == {
                  "url": "https://raw.githubusercontent.com/riccilnl/my-scripting-widgets/refs/heads/main/Send%20to%20BOOX.scripting",
                  "autoUpdateInterval": 3600,
              }
          print("SEND_TO_BOOX_PACKAGE_PASS")
          PY

      - name: Publish package and installation link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp 'Send to BOOX.scripting' "${RUNNER_TEMP}/boox-built.scripting"

          # Rapid source pushes make older workflow checkouts stale. Never
          # publish a package if main contains newer BOOX source or workflow.
          # Reapply only the verified artifact to the current main commit.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "${GITHUB_SHA}" origin/main -- 'scripts/Send to BOOX' '.github/workflows/build-send-to-boox.yml'; then
              echo "A newer BOOX source commit exists; its workflow will publish."
              exit 0
            fi

            git reset --hard origin/main
            cp "${RUNNER_TEMP}/boox-built.scripting" 'Send to BOOX.scripting'
            node - <<'NODE'
          const links = require('./scripts/update_links.js')
          links.updateReadme(links.validateReadme(process.cwd()), links.getScriptingFiles(process.cwd()))
          NODE
            git add -- 'Send to BOOX.scripting' README.md
            if git diff --cached --quiet; then
              echo "Installation package is already current."
              exit 0
            fi
            git commit -m "build(boox): publish Scripting installation package"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during publish attempt ${attempt}; retrying"
          done
          echo "Publish failed after 3 attempts"
          exit 1
