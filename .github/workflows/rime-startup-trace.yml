name: Publish Rime startup diagnostics preview

on:
  push:
    branches:
      - "perf/rime-startup-trace"
    paths:
      - "scripts/rime输入法/**"
      - ".github/workflows/rime-startup-trace.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rime-startup-trace
  cancel-in-progress: false

jobs:
  build-startup-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch including frozen release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate keyboard behavior and packaging
        run: |
          node --test scripts/rime输入法/tests/runtime.test.cjs
          node --test scripts/update_links.test.js
      - name: Build isolated startup diagnostics keyboard
        run: python3 -B scripts/rime输入法/tests/create_startup_diagnostic_preview.py
      - name: Verify every packaged source file
        run: python3 -B scripts/rime输入法/tests/verify_startup_diagnostic_preview.py
      - name: Build matched Lazy-vs-plain startup A/B keyboards
        run: |
          python3 -B scripts/rime输入法/tests/create_lazy_ab_preview.py
          python3 -B scripts/rime输入法/tests/verify_lazy_ab_preview.py
      - name: Commit diagnostic installation package only on preview branch
        run: |
          set -eu
          mkdir -p previews/rime-startup-20261013
          cp .git/perf-preview/Rime-startup-trace-0.3.53-preview.scripting previews/rime-startup-20261013/
          cp .git/perf-preview/Rime-startup-trace-latest.zip previews/rime-startup-20261013/
          # Compatibility: iPhone Scripting pinned this versioned URL.
          # Keep the old imported URL serving the latest valid archive.
          # This historic filename is intentionally a mutable compatibility alias.
          cp .git/perf-preview/Rime-startup-trace-latest.zip previews/rime-startup-20261013/Rime-startup-trace-0.3.46-preview.scripting
          cmp previews/rime-startup-20261013/Rime-startup-trace-0.3.46-preview.scripting previews/rime-startup-20261013/Rime-startup-trace-latest.zip
          (cd previews/rime-startup-20261013 &&
            sha256sum Rime-startup-trace-0.3.46-preview.scripting Rime-startup-trace-0.3.53-preview.scripting Rime-startup-trace-latest.zip > SHA256SUMS.txt)
          cat > previews/rime-startup-20261013/README.md <<'EOF'
          # Rime startup diagnostics preview

          Install/update Rime启动诊断测试 ONLY from this stable ZIP URL:
          https://raw.githubusercontent.com/riccilnl/my-scripting-widgets/refs/heads/perf/rime-startup-trace/previews/rime-startup-20261013/Rime-startup-trace-latest.zip

          WARNING: The Scripting importer may persist the address that was
          actually imported into remoteResource.url, overriding the manifest.
          Never give users a versioned .scripting or immutable commit link as
          the recommended auto-update installation URL.
          The ORIGINAL 0.3.46-preview.scripting URL was pinned on iPhone.
          It is now a MUTABLE compatibility alias for latest.zip, NOT a frozen
          v0.3.46 snapshot. Keep refreshing BOTH latest.zip and this alias
          on EVERY future test release until the phone demonstrably changes.
          Other versioned .scripting files remain snapshots; never give them
          as auto-update subscription links. Each future test release MUST
          increment the manifest version. Interval 3600 seconds is check cadence.
          Open its settings -> 性能诊断 -> 启用启动诊断.
          Dismiss and reopen the keyboard, then refresh this page.

          Records only Rime startup phase names, elapsed times, layout and success/failure/cancel.
          It never records text, candidates, paths or full schema identifiers.
          Default OFF; only the most recent startup is persisted.
          The displayed "present.return" does NOT mean the UI frame became visible.
          This package may share Rime dictionaries, schemas and App Group data with
          the official keyboard. Avoid schema deployment/update while testing.

          Official main 0.3.52 and the earlier A/B packages are unchanged.
          EOF
          # A/B packages are independently named snapshots, not a replacement
          # for the stable preview's auto-update latest.zip.
          mkdir -p previews/rime-lazy-ab-20261013
          cp .git/perf-preview/Rime-startup-lazy-0.3.54.scripting previews/rime-lazy-ab-20261013/
          cp .git/perf-preview/Rime-startup-plain-0.3.54.scripting previews/rime-lazy-ab-20261013/
          (cd previews/rime-lazy-ab-20261013 &&
            sha256sum Rime-startup-lazy-0.3.54.scripting Rime-startup-plain-0.3.54.scripting > SHA256SUMS.txt)
          cp scripts/rime输入法/docs/LAZY_STARTUP_AB_2026-10-13.md previews/rime-lazy-ab-20261013/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- previews/rime-startup-20261013 previews/rime-lazy-ab-20261013
          if ! git diff --cached --quiet; then
            git commit -m "build(rime): publish independent startup diagnostics preview"
            git push origin HEAD:refs/heads/perf/rime-startup-trace
          fi
