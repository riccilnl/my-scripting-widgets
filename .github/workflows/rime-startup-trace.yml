name: Publish Rime startup diagnostics preview

on:
  push:
    branches:
      - "perf/rime-startup-trace"
    paths:
      - "scripts/rime输入法/**"
      - ".github/workflows/rime-startup-trace.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rime-startup-trace
  cancel-in-progress: false

jobs:
  build-startup-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch including frozen release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate keyboard behavior and packaging
        run: |
          node --test scripts/rime输入法/tests/runtime.test.cjs
          node --test scripts/update_links.test.js
      - name: Build isolated startup diagnostics keyboard
        run: python3 -B scripts/rime输入法/tests/create_startup_diagnostic_preview.py
      - name: Verify every packaged source file
        run: python3 -B scripts/rime输入法/tests/verify_startup_diagnostic_preview.py
      - name: Build immutable startup A/B controls
        run: python3 -B scripts/rime输入法/tests/create_startup_ab_previews.py
      - name: Verify immutable startup A/B controls
        run: python3 -B scripts/rime输入法/tests/verify_startup_ab_previews.py
      - name: Upload startup A/B controls artifact
        uses: actions/upload-artifact@v4
        with:
          name: rime-startup-ab-controls-0.1.0
          path: |
            previews/rime-startup-ab-20261014/Rime-startup-ab-full-deps-0.1.0.scripting
            previews/rime-startup-ab-20261014/Rime-startup-ab-minimal-deps-0.1.0.scripting
          if-no-files-found: error
          retention-days: 14
      - name: Build independent compiler payload experiment
        run: python3 -B scripts/rime输入法/tests/create_compiler_payload_preview.py
      - name: Verify compiler payload source, archive and import graph
        run: |
          python3 -B scripts/rime输入法/tests/verify_compiler_payload_preview.py
          python3 -B scripts/rime输入法/tests/audit_startup_compile_graph.py
      - name: Verify compiler payload T9 behavior under VM
        run: node --test scripts/rime输入法/tests/verify_compiler_payload_runtime.cjs
      - name: Upload compiler payload installer
        uses: actions/upload-artifact@v4
        with:
          name: rime-compiler-payload-0.3.58
          path: previews/rime-compiler-payload-20261015/Rime-compiler-payload-0.3.58-preview.scripting
          if-no-files-found: error
          retention-days: 14
      - name: Commit diagnostic installation package only on preview branch
        run: |
          set -eu
          mkdir -p previews/rime-startup-20261013
          # Preserve frozen 0.3.57 and 0.3.58 for rollback; publish 0.3.59 separately.
          cp .git/perf-preview/Rime-startup-trace-0.3.59-preview.scripting previews/rime-startup-20261013/
          cp .git/perf-preview/Rime-startup-trace-latest.zip previews/rime-startup-20261013/
          # Compatibility: iPhone Scripting pinned this versioned URL.
          # Keep the old imported URL serving the latest valid archive.
          # This historic filename is intentionally a mutable compatibility alias.
          cp .git/perf-preview/Rime-startup-trace-latest.zip previews/rime-startup-20261013/Rime-startup-trace-0.3.46-preview.scripting
          cmp previews/rime-startup-20261013/Rime-startup-trace-0.3.46-preview.scripting previews/rime-startup-20261013/Rime-startup-trace-latest.zip
          (cd previews/rime-startup-20261013 &&
            sha256sum Rime-startup-trace-0.3.46-preview.scripting Rime-startup-trace-0.3.57-preview.scripting Rime-startup-trace-0.3.58-preview.scripting Rime-startup-trace-0.3.59-preview.scripting Rime-startup-trace-latest.zip > SHA256SUMS.txt)
          cat > previews/rime-startup-20261013/README.md <<'EOF'
          # Rime startup diagnostics preview

          Install/update Rime启动诊断测试 ONLY from this stable ZIP URL:
          https://raw.githubusercontent.com/riccilnl/my-scripting-widgets/refs/heads/perf/rime-startup-trace/previews/rime-startup-20261013/Rime-startup-trace-latest.zip

          WARNING: The Scripting importer may persist the address that was
          actually imported into remoteResource.url, overriding the manifest.
          Never give users a versioned .scripting or immutable commit link as
          the recommended auto-update installation URL.
          The ORIGINAL 0.3.46-preview.scripting URL was pinned on iPhone.
          It is now a MUTABLE compatibility alias for latest.zip, NOT a frozen
          v0.3.46 snapshot. Keep refreshing BOTH latest.zip and this alias
          on EVERY future test release until the phone demonstrably changes.
          Other versioned .scripting files remain snapshots; never give them
          as auto-update subscription links. Each future test release MUST
          increment the manifest version. Interval 3600 seconds is check cadence.
          Open its settings -> 性能诊断 -> 启用启动诊断.
          Dismiss and reopen the keyboard, then refresh this page.

          0.3.59 now follows the SAME mutable URL as 0.3.58.
          The embedded T9 Lua resource moved out of the initial TS import
          graph to a packaged file read only when T9 repair is needed.
          It is a compiler-load hypothesis, NOT a proven speed improvement.
          The previously published 0.3.57 and 0.3.58 snapshots are frozen for rollback.
          The installed iPhone may pin a previous versioned download URL;
          that 0.3.46 compatibility alias stays synchronized with latest.
          An iPhone update and actual T9 first-frame / functionality test are
          still required. No automatic change to the official main keyboard.

          This preview isolates candidate-bar updates and T9 left-column
          pinyin-choice updates from the keyboard root. The original CandidateBar
          and T9PinyinColumn touch/scroll geometry, nine-key Lua, and Rime
          initialization order are unchanged. Verify Chinese/ASCII T9 switching,
          pinyin selection, space swipes, 26-key input and expanded scrolling.

          0.3.57 introduced Settings -> 键盘设置 -> 动作与工具栏 ->
          显示工具栏（性能对照） switch. Off omits the idle toolbar
          nodes while retaining candidate and initialization-status headers.
          The original top height remains reserved. Reopen the keyboard
          to apply settings. iPhone spinner reduction is unverified.

          Records only Rime startup phase names, elapsed times, layout and success/failure/cancel.
          It never records text, candidates, paths or full schema identifiers.
          Default OFF; only the most recent startup is persisted.
          The displayed "present.return" does NOT mean the UI frame became visible.
          This package may share Rime dictionaries, schemas and App Group data with
          the official keyboard. Avoid schema deployment/update while testing.

          0.3.59: T9 right-rail second key shares system background role
          with Backspace; its configured command and touch area are unchanged.
          Official main is unchanged.
          EOF
          # Independent immutable A/B installers: do not replace Rime latest.zip.
          mkdir -p previews/rime-startup-ab-20261014
          # Historical A/B controls are immutable across new preview releases.
          (cd previews/rime-startup-ab-20261014 && sha256sum -c SHA256SUMS.txt)
          (cd previews/rime-startup-ab-20261014 &&
            sha256sum Rime-startup-ab-full-deps-0.1.0.scripting Rime-startup-ab-minimal-deps-0.1.0.scripting > SHA256SUMS.txt)
          cat > previews/rime-startup-ab-20261014/README.md <<'ABEOF'
          # Frozen 0.1.0 startup-chain A/B

          Rime-startup-ab-full-deps-0.1.0.scripting is control A:
          full 0.3.57 static Rime dependency graph, but minimal UI / no Rime setup.
          Rime-startup-ab-minimal-deps-0.1.0.scripting is control B:
          just three files, no Rime imports, the same minimal UI.
          Both have an input A button and match the native toolbar and height
          presentation calls. Neither modifies the existing Rime keyboard.

          UPDATED iPhone video findings (2026-10-15): A, B and full Rime ALL
          show a short Scripting keyboard loading spinner. Wanxiang updater
          ALSO shows a spinner, but the user observed it ends much sooner:
          the script UI is already visible as the keyboard opens fully.
          Prior claims of zero spinner for A or Wanxiang were inaccurate.

          These are historical frozen installers (no auto-update). Do not
          repeat the obsolete script-internal A-B-B-A switching experiment.
          The valid measure is time from EXTERNAL system keyboard activation
          into Scripting to first visible frame and first usable input.
          No iPhone first-frame measurement can be inferred from JS marks.
          Static imports may be optimized by the Scripting runtime.
          See scripts/rime输入法/docs/STARTUP_FIRST_FRAME_BASELINE_2026-10-15.md.
          ABEOF
          mkdir -p previews/rime-compiler-payload-20261015
          # Keep the independent 0.3.58 compiler experiment immutable.
          (cd previews/rime-compiler-payload-20261015 && sha256sum -c SHA256SUMS.txt)
          (cd previews/rime-compiler-payload-20261015 &&
            sha256sum Rime-compiler-payload-0.3.58-preview.scripting > SHA256SUMS.txt)
          cat > previews/rime-compiler-payload-20261015/README.md <<'CP_EOF'
          # Compiler payload experiment 0.3.58

          Independent frozen test keyboard with the ORIGINAL keyboard.tsx.
          The T9 Lua source was moved out of the eager TS static import graph
          into an identically-versioned package file. The verified normal
          T9 fast path never reads the packaged asset; stale repair does.

          Eager TS sources: baseline 60 modules / 270321 bytes;
          this experiment 59 modules / 245562 bytes (-24759, 9.16%).
          Those figures are source sizes, NOT iPhone compile timings.

          Test external-keyboard activation to Scripting, first frame,
          typing, 26-key and T9. Asset read compatibility and any startup
          improvement remain UNVERIFIED on a real iPhone. No auto-update.
          Never replace the original keyboard or 0.3.57 latest URL.
          See scripts/rime输入法/docs/COMPILER_PAYLOAD_0.3.58_2026-10-15.md.
          CP_EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- previews/rime-startup-20261013 previews/rime-startup-ab-20261014 previews/rime-compiler-payload-20261015
          if ! git diff --cached --quiet; then
            git commit -m "build(rime): publish independent startup diagnostics preview"
            git push origin HEAD:refs/heads/perf/rime-startup-trace
          fi
